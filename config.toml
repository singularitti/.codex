approval_policy = "on-request"
model = "gpt-6-astra"
model_provider = "openai_http"
model_reasoning_effort = "xhigh"
model_reasoning_summary = "detailed"
model_verbosity = "medium"
personality = "pragmatic"
sandbox_mode = "danger-full-access"
service_tier = "default"

[agents]
enabled = true
# Number of child agent threads Codex may keep open concurrently.
# Start with 4–6. Increase only when the work is genuinely parallel.
max_concurrent_threads_per_session = 6
# Default for any spawned subagent that does not explicitly choose a model.
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "high"

[desktop]
ambient-suggestions-enabled = true
appearanceDarkCodeThemeId = "everforest"
appearanceLightCodeThemeId = "rose-pine"
codeFontSize = 13
composerEnterBehavior = "cmdIfMultiline"
composerPlainTextMode = true
conversationDetailMode = "STEPS_COMMANDS"
defaultTerminalLocation = "right"
enabled-reasoning-efforts = [ "low", "medium", "high", "xhigh", "max", "ultra" ]
followUpQueueMode = "steer"
hotkey-window-projectless-default-enabled = true
keepRemoteControlAwakeWhilePluggedIn = true
mac-menu-bar-enabled = false
notifications-turn-mode = "unfocused"
open-link-in-target-preference = "external-browser"
preventSleepWhileRunning = true
sansFontSize = 13
selected-avatar-id = "rocky"
show-context-window-usage = true
show-ultra-in-model-picker-slider = true
useFontSmoothing = true
usePointerCursors = true
worktree-upstream-refresh-mode = "best-effort"
toys-confetti-enabled = true
toys-audio-visualizer-enabled = true
browser-show-full-url = true

[desktop.appearanceDarkChromeTheme]
accent = "#a7c080"
contrast = 20
ink = "#d3c6aa"
opaqueWindows = false
surface = "#2d353b"

[desktop.appearanceDarkChromeTheme.fonts]
code = '"Monaspace Argon NF"'
content = '"Monaspace Argon Var"'
ui = '"SF Pro"'

[desktop.appearanceDarkChromeTheme.fonts.codeFace]
family = "Monaspace Argon NF"
fullName = "Monaspace Argon NF Light"
postscriptName = "MonaspaceArgonNF-Light"

[desktop.appearanceDarkChromeTheme.fonts.contentFace]
family = "Monaspace Argon Var"
fullName = "Monaspace Argon Var ExtraLight Light"
postscriptName = "MonaspaceArgonVar-Light"

[desktop.appearanceDarkChromeTheme.fonts.uiFace]
family = "SF Pro"
fullName = "SF Pro Light"
postscriptName = "SFPro-Light"

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#a7c080"
diffRemoved = "#e67e80"
skill = "#d699b6"

[desktop.appearanceLightChromeTheme]
accent = "#d7827e"
contrast = 45
ink = "#575279"
opaqueWindows = false
surface = "#faf4ed"

[desktop.appearanceLightChromeTheme.fonts]
code = '"Monaspace Argon NF"'
content = '"Monaspace Argon Var"'
ui = '"SF Pro"'

[desktop.appearanceLightChromeTheme.fonts.codeFace]
family = "Monaspace Argon NF"
fullName = "Monaspace Argon NF Light"
postscriptName = "MonaspaceArgonNF-Light"

[desktop.appearanceLightChromeTheme.fonts.contentFace]
family = "Monaspace Argon Var"
fullName = "Monaspace Argon Var ExtraLight Light"
postscriptName = "MonaspaceArgonVar-Light"

[desktop.appearanceLightChromeTheme.fonts.uiFace]
family = "SF Pro"
fullName = "SF Pro Light"
postscriptName = "SFPro-Light"

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#56949f"
diffRemoved = "#797593"
skill = "#907aa9"

[desktop.open-in-target-preferences]
global = "systemDefault"

[features]
chronicle = false
hooks = true
js_repl = false
memories = true
multi_agent = true
workspace_dependencies = true

[memories]
consolidation_model = "gpt-5.6-luna"
extract_model = "gpt-5.6-luna"
generate_memories = true
use_memories = true

[model_providers.openai_http]
name = "OpenAI HTTP"
requires_openai_auth = true
supports_websockets = false
wire_api = "responses"
[tui]
status_line = ["model-with-reasoning", "current-dir", "project-name", "hostname", "git-branch", "pull-request-number", "run-state", "permissions", "approval-mode", "context-used", "five-hour-limit", "task-progress"]
status_line_use_colors = true
